<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="title description">
  <title id="title">Kevin Song — AI for biology</title>
  <desc id="description">A charcoal and teal header with a molecular network illustration. Kevin Song. AI for biology. Systems built to explain. Protein representations, molecular graphs, scientific software.</desc>
  <defs>
